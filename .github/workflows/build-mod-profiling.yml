name: Build Mod (Profiling)

on:
  push:
    branches: [dev]
    paths:
      - "mod/**"
      - ".github/workflows/build-mod-profiling.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # Keep in sync with mod/rust-toolchain.toml (the authoritative pin,
        # honored by rustup; see the comment there for why).
        id: toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mod/target
          key: ${{ runner.os }}-cargo-mod-profiling-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('mod/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mod-profiling-${{ steps.toolchain.outputs.cachekey }}-

      - name: Run tests
        run: cargo test --lib

      - name: Build profiling DLL
        run: cargo build --lib --release --features profile-tracy

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload profiling DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedfog-racing-mod-v${{ steps.version.outputs.version }}-profiling
          path: mod/target/release/speedfog_racing.dll
          if-no-files-found: error
