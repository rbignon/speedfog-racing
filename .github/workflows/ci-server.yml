name: Server CI

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy speedfog_racing/

      - name: Run tests
        run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: speedfog
          POSTGRES_PASSWORD: speedfog
          POSTGRES_DB: speedfog_racing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speedfog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://speedfog:speedfog@localhost:5432/speedfog_racing
      SECRET_KEY: ci-only-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Apply all migrations
        run: uv run alembic upgrade head
