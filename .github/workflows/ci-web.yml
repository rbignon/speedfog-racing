name: Web CI

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Format check
        run: npx prettier --check .

      # eslint is intentionally absent: the repo carries a deferred baseline
      # of 53 errors (mostly prefer-svelte-reactivity). Add "npx eslint ."
      # here once the baseline is cleared.

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
