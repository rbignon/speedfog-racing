# SpeedFog Racing - nginx site config
# Usage: symlink to /etc/nginx/sites-enabled/
#
# Rate-limit zones: these directives belong in the http{} context.
# If this file is included as a site config (not the main nginx.conf),
# add the following lines to /etc/nginx/nginx.conf instead:
#
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;
#   limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream speedfog_api {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name racing.speedfog.example;  # CHANGEME

    return 301 https://$host$request_uri;
}

# HTTPS server block. Activate after: certbot --nginx -d racing.speedfog.example
server {
    listen 443 ssl http2;
    server_name racing.speedfog.example;  # CHANGEME

    ssl_certificate /etc/letsencrypt/live/racing.speedfog.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racing.speedfog.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' wss:; img-src 'self' https://static-cdn.jtvnw.net;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression for text-based responses (HTML, JS, CSS, JSON, SVG)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;

    # SvelteKit static build
    root /opt/speedfog-racing/web-build;
    index index.html;

    # API reverse proxy
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://speedfog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket reverse proxy
    location /ws/ {
        limit_req zone=ws burst=10 nodelay;
        limit_conn ws_conn 10;
        proxy_pass http://speedfog_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;  # Keep WS alive for 24h
    }

    # Health check (bypass SPA)
    location = /health {
        proxy_pass http://speedfog_api;
    }

    # SvelteKit hashed assets: immutable, can be cached forever.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The @font-face sheet may change without a rename (new face, new range):
    # short TTL, revalidation is cheap and does not touch registered faces.
    location = /fonts/fonts.css {
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # Self-hosted font subsets. Not content-hashed, but stable: any reshaped
    # subset gets a new filename. Long caching keeps returning visitors from
    # revalidating at font consumption time (client-rendered app: faces load
    # after first paint, so a revalidation round-trip there is a visible flash).
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Route known social-media crawlers on /race/<id>, /daily, and
    # /daily/<yyyy-mm-dd> to FastAPI Open Graph endpoints. Humans fall through
    # to the SPA served by the catch-all `location /` below.
    #
    # The crawler branches use `rewrite ... last` rather than `proxy_pass` with
    # a URI part, because nginx forbids URI-bearing `proxy_pass` inside an `if`
    # block. The rewritten URI matches `location /api/` above, which proxies
    # to the upstream without a URI part (preserving the rewritten path).
    location ~ ^/race/([^/]+)/?$ {
        set $race_id $1;
        if ($http_user_agent ~* "(Twitterbot|facebookexternalhit|Discordbot|LinkedInBot|Slackbot|TelegramBot|WhatsApp|Pinterest|redditbot|Googlebot|bingbot)") {
            rewrite ^ /api/og/race/$race_id/meta last;
        }
        try_files $uri $uri.html $uri/ /200.html;
    }

    location ~ ^/daily/?$ {
        if ($http_user_agent ~* "(Twitterbot|facebookexternalhit|Discordbot|LinkedInBot|Slackbot|TelegramBot|WhatsApp|Pinterest|redditbot|Googlebot|bingbot)") {
            rewrite ^ /api/og/daily/today/meta last;
        }
        try_files $uri $uri.html $uri/ /200.html;
    }

    location ~ "^/daily/(\d{4}-\d{2}-\d{2})/?$" {
        set $daily_date $1;
        if ($http_user_agent ~* "(Twitterbot|facebookexternalhit|Discordbot|LinkedInBot|Slackbot|TelegramBot|WhatsApp|Pinterest|redditbot|Googlebot|bingbot)") {
            rewrite ^ /api/og/daily/$daily_date/meta last;
        }
        try_files $uri $uri.html $uri/ /200.html;
    }

    # Serve prerendered pages if available, then SPA fallback
    location / {
        try_files $uri $uri.html $uri/ /200.html;
    }
}
