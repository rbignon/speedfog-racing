# SpeedFog Racing - Expedition Pool Configuration
# ~5 hour races through most of the Lands Between
extends = "_base"

# Path spread scales with layers_count: at 90 layers the median spread is
# ~11 min, so _base's tolerance = 5 would reroll every candidate.
[budget]
tolerance = 15

[display]
name = "Expedition"
sort_order = 50
estimated_duration = "~4h"
description = "Epic race through most of the Lands Between"

[requirements]
legacy_dungeons = 8
bosses = 15
mini_dungeons = 15
major_bosses = 15

[structure]
layers_count = 90
max_parallel_paths = 2
max_exits = 2
max_entrances = 2
split_probability = 0.8
merge_probability = 0.2
min_branch_age = 3
final_tier = 21
tier_curve = "power"
tier_curve_exponent = 0.8
first_layer_type = "legacy_dungeon"
final_boss_candidates = [
    "leyndell_erdtree",
    "enirilim_radahn",
]

[starting_items]
whetblades = true
talisman_pouches = 3
golden_seeds = 7
sacred_tears = 4
starting_runes = 40000
larval_tears = 3
stonesword_keys = 6

[care_package]
enabled = true
weapon_upgrade = 25
weapons = 0
shields = 0
catalysts = 2
talismans = 2
sorceries = 2
incantations = 2
head_armor = 1
body_armor = 1
arm_armor = 1
leg_armor = 1
crystal_tears = 5
ashes_of_war = 3

[item_randomizer]
difficulty = 50
nerf_gargoyles = true

[enemy]
randomize_bosses = "minor"
