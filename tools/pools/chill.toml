# SpeedFog Racing - Chill Pool Configuration
# ~1 hour races, generous resources for a relaxed experience
extends = "_base"

[display]
name = "Chill"
sort_order = 30
estimated_duration = "~1h"
description = "Relaxed race with generous resources and loot"

[requirements]
legacy_dungeons = 3
bosses = 5
mini_dungeons = 5
major_bosses = 9
# Major bosses too punishing for a relaxed race, never in the DAG (final boss
# included: "all" below resolves against the filtered pool).
exclude_zones = [
    "haligtree_malenia",        # Malenia, Blade of Miquella
    "enirilim_radahn",          # Promised Consort Radahn
    "farumazula_placidusax",    # Dragonlord Placidusax
    "jaggedpeak_bayle",         # Bayle the Dread
    "scadutree_base",           # Scadutree Avatar
    "fingergrounds",            # Metyr, Mother of Fingers
    "farumazula_godskinduo",    # Godskin Duo
    "siofra_nokron_gargoyles",  # Valiant Gargoyles
]

[structure]
layers_count = 30
final_tier = 16
tier_curve = "power"
tier_curve_exponent = 1.5
first_layer_type = "legacy_dungeon"
final_boss_candidates = ["all"]

[starting_items]
whetblades = true
talisman_pouches = 3
golden_seeds = 10
sacred_tears = 6
starting_runes = 100000
larval_tears = 6
stonesword_keys = 6

[care_package]
enabled = true
weapon_upgrade = 25
weapons = 4
shields = 2
catalysts = 2
talismans = 4
sorceries = 5
incantations = 5
head_armor = 2
body_armor = 2
arm_armor = 2
leg_armor = 2
crystal_tears = 5
ashes_of_war = 5

[item_randomizer]
difficulty = 35
nerf_gargoyles = true

[enemy]
randomize_bosses = "minor"
